<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Trust boundary and provenance</title><desc id="d">External content is labeled untrusted, passed through bounded context, and checked by application authorization before a tool call.</desc><rect width="900" height="300" rx="24" fill="#f4f8ff"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="30" y="76" width="220" height="150" rx="18" fill="#fff1f2" stroke="#e7a1aa" stroke-width="2"/><text x="140" y="112" font-size="19" font-weight="700" fill="#8f2636">Untrusted input</text><text x="140" y="143" font-size="15" fill="#8f2636">Web / file / email</text><text x="140" y="171" font-size="14" fill="#8f2636">Source + provenance</text><path d="M251 151h62m-12-9 12 9-12 9" stroke="#64748b" stroke-width="4" fill="none"/><rect x="320" y="76" width="235" height="150" rx="18" fill="#fff" stroke="#93b4e5" stroke-width="2"/><text x="437" y="112" font-size="19" font-weight="700" fill="#1e477e">Bounded context</text><text x="437" y="143" font-size="15" fill="#385a82">Minimize and label</text><text x="437" y="171" font-size="14" fill="#385a82">No authority transfer</text><path d="M556 151h62m-12-9 12 9-12 9" stroke="#64748b" stroke-width="4" fill="none"/><rect x="625" y="76" width="245" height="150" rx="18" fill="#ecfdf5" stroke="#75c6a0" stroke-width="2"/><text x="747" y="112" font-size="19" font-weight="700" fill="#176344">Application gate</text><text x="747" y="143" font-size="15" fill="#176344">Check capability + scope</text><text x="747" y="171" font-size="14" fill="#176344">Approve / block / log</text><text x="450" y="265" font-size="15" fill="#52647b">Trust is assigned by the system, not by the content itself.</text></g></svg>
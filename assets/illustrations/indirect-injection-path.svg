<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="t d"><title id="t">Indirect prompt injection control point</title><desc id="d">A retrieved malicious instruction can influence a model proposal, but a separate policy gate checks the proposed action before execution.</desc><rect width="900" height="300" rx="24" fill="#f8f7ff"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="30" y="82" width="200" height="118" rx="16" fill="#fff1f2" stroke="#e8a1ac" stroke-width="2"/><text x="130" y="119" fill="#922d3c" font-size="18" font-weight="700">Retrieved content</text><text x="130" y="148" fill="#922d3c" font-size="14">May contain hostile</text><text x="130" y="169" fill="#922d3c" font-size="14">instructions</text><path d="M232 141h52m-10-8 10 8-10 8" stroke="#64748b" stroke-width="4" fill="none"/><rect x="290" y="82" width="190" height="118" rx="16" fill="#fff" stroke="#a9a2e5" stroke-width="2"/><text x="385" y="119" fill="#4e4597" font-size="18" font-weight="700">Model proposal</text><text x="385" y="148" fill="#625a9e" font-size="14">Suggested action</text><text x="385" y="169" fill="#625a9e" font-size="14">is not permission</text><path d="M482 141h52m-10-8 10 8-10 8" stroke="#64748b" stroke-width="4" fill="none"/><rect x="540" y="82" width="160" height="118" rx="16" fill="#fff" stroke="#82a9db" stroke-width="2"/><text x="620" y="119" fill="#1e477e" font-size="18" font-weight="700">Policy gate</text><text x="620" y="148" fill="#385a82" font-size="14">Validate action</text><text x="620" y="169" fill="#385a82" font-size="14">and arguments</text><path d="M702 141h52m-10-8 10 8-10 8" stroke="#64748b" stroke-width="4" fill="none"/><rect x="760" y="82" width="110" height="118" rx="16" fill="#ecfdf5" stroke="#75c6a0" stroke-width="2"/><text x="815" y="128" fill="#176344" font-size="17" font-weight="700">Allow /</text><text x="815" y="151" fill="#176344" font-size="17" font-weight="700">block</text><text x="450" y="253" fill="#52647b" font-size="15">Treat retrieved text as data. Enforce authorization outside the model.</text></g></svg>
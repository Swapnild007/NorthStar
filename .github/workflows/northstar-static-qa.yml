name: NorthStar Static QA

on:
  push:
    branches: ["main"]
    paths:
      - "app.js"
      - "index.html"
      - "data/**/*.js"
      - "qa/**"
      - ".github/workflows/northstar-static-qa.yml"
  pull_request:
    paths:
      - "app.js"
      - "index.html"
      - "data/**/*.js"
      - "qa/**"
      - ".github/workflows/northstar-static-qa.yml"
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          set -e
          node --check app.js
          for file in data/*.js; do node --check "$file"; done
      - name: Run NorthStar structural QA
        run: node qa/validate.mjs

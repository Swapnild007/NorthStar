name: NorthStar Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'data/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare bundled web app
        run: |
          mkdir -p www
          cp index.html app.js styles.css www/
          cp -R data www/data
          test -s www/index.html
          test -s www/app.js
          test -s www/styles.css

          # APK-only cinematic intro. The repository's actual web app files stay untouched.
          cat > www/apk-intro.js <<'INTRO'
          (() => {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
              return;
            }

            const style = document.createElement('style');
            style.textContent = `
              #northstar-apk-intro {
                position: fixed; inset: 0; z-index: 2147483000;
                display: grid; place-items: center; overflow: hidden;
                color: #f5f8ff; text-align: center;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background:
                  radial-gradient(ellipse at 50% 62%, rgba(28,112,185,.25), transparent 38%),
                  radial-gradient(ellipse at 50% 100%, rgba(8,48,92,.8), transparent 55%),
                  linear-gradient(160deg, #050d1c 0%, #07172c 55%, #030813 100%);
                opacity: 1; transition: opacity .75s ease, visibility .75s ease;
              }
              #northstar-apk-intro.is-leaving { opacity: 0; visibility: hidden; pointer-events: none; }
              #northstar-apk-intro .ns-stars, #northstar-apk-intro .ns-stars:before,
              #northstar-apk-intro .ns-stars:after {
                position: absolute; inset: 0; content: ""; pointer-events: none;
                background-image:
                  radial-gradient(1px 1px at 8% 17%, #c9e8ff 98%, transparent),
                  radial-gradient(1px 1px at 22% 73%, #d9eaff 98%, transparent),
                  radial-gradient(1.5px 1.5px at 76% 21%, #fff 98%, transparent),
                  radial-gradient(1px 1px at 88% 66%, #b6dfff 98%, transparent),
                  radial-gradient(1px 1px at 56% 11%, #fff 98%, transparent),
                  radial-gradient(1px 1px at 42% 86%, #b6dfff 98%, transparent),
                  radial-gradient(1px 1px at 94% 39%, #fff 98%, transparent);
                background-size: 100% 100%;
                animation: ns-twinkle 4s ease-in-out infinite alternate;
              }
              #northstar-apk-intro .ns-stars:before { transform: scale(1.25); opacity: .42; animation-delay: -1.7s; }
              #northstar-apk-intro .ns-stars:after { transform: scale(.85); opacity: .35; animation-delay: -2.8s; }
              #northstar-apk-intro .ns-content {
                position: relative; z-index: 1; width: min(88vw, 440px);
                display: flex; flex-direction: column; align-items: center;
                animation: ns-rise 1.1s cubic-bezier(.2,.75,.25,1) both;
              }
              #northstar-apk-intro .ns-emblem {
                width: clamp(124px, 34vw, 174px); height: auto;
                filter: drop-shadow(0 0 22px rgba(89,187,255,.48));
                animation: ns-glow 3.2s ease-in-out infinite alternate;
              }
              #northstar-apk-intro .ns-wordmark {
                margin: 24px 0 0; font-size: clamp(27px, 7vw, 36px);
                font-weight: 750; letter-spacing: .23em; padding-left: .23em;
                line-height: 1.15; text-shadow: 0 2px 22px rgba(103,181,255,.22);
              }
              #northstar-apk-intro .ns-subtitle {
                margin-top: 11px; font-size: 10px; letter-spacing: .25em;
                color: #a8c9e8; text-transform: uppercase; padding-left: .25em;
              }
              #northstar-apk-intro .ns-rule {
                width: 68px; height: 1px; margin: 25px 0 19px;
                background: linear-gradient(90deg, transparent, #75caff, transparent);
                box-shadow: 0 0 12px #4eaeef;
              }
              #northstar-apk-intro .ns-credit {
                color: #d4e1f1; font-size: 12px; letter-spacing: .035em;
              }
              #northstar-apk-intro .ns-credit strong { color: #fff; font-weight: 650; }
              #northstar-apk-intro .ns-enter {
                margin-top: 34px; border: 1px solid rgba(142,198,242,.55);
                border-radius: 999px; padding: 12px 25px; color: #f5faff;
                background: rgba(91,157,211,.12); font: inherit; font-size: 11px;
                letter-spacing: .16em; text-transform: uppercase; cursor: pointer;
                box-shadow: 0 0 28px rgba(57,147,220,.12);
                transition: background .2s ease, transform .2s ease;
              }
              #northstar-apk-intro .ns-enter:active { transform: scale(.97); background: rgba(91,157,211,.25); }
              #northstar-apk-intro .ns-horizon {
                position: absolute; width: 150vw; height: 42vw; min-height: 170px;
                bottom: -29vw; border-radius: 50% 50% 0 0;
                background: radial-gradient(ellipse at 50% 0%, rgba(72,172,242,.38), rgba(13,63,112,.14) 33%, transparent 68%);
                border-top: 1px solid rgba(105,192,255,.45);
                box-shadow: 0 -12px 60px rgba(28,126,207,.13);
              }
              @keyframes ns-twinkle { from { opacity: .5; } to { opacity: 1; } }
              @keyframes ns-rise { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
              @keyframes ns-glow { from { filter: drop-shadow(0 0 14px rgba(89,187,255,.25)); } to { filter: drop-shadow(0 0 28px rgba(89,187,255,.58)); } }
              @media (prefers-reduced-motion: reduce) {
                #northstar-apk-intro, #northstar-apk-intro * { animation: none !important; transition: none !important; }
              }
            `;
            document.head.appendChild(style);

            const intro = document.createElement('section');
            intro.id = 'northstar-apk-intro';
            intro.setAttribute('aria-label', 'NorthStar opening screen');
            intro.innerHTML = `
              <div class="ns-stars" aria-hidden="true"></div>
              <div class="ns-horizon" aria-hidden="true"></div>
              <div class="ns-content">
                <svg class="ns-emblem" viewBox="0 0 200 220" role="img" aria-label="NorthStar compass shield">
                  <defs>
                    <linearGradient id="ns-metal" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0" stop-color="#e4f5ff"/><stop offset=".48" stop-color="#71c5ff"/>
                      <stop offset="1" stop-color="#2877bd"/>
                    </linearGradient>
                    <radialGradient id="ns-core"><stop stop-color="#eafaff"/><stop offset=".3" stop-color="#7bd3ff"/><stop offset="1" stop-color="#2477bb"/></radialGradient>
                  </defs>
                  <path d="M100 8 168 35v58c0 49-29 88-68 116C61 181 32 142 32 93V35Z"
                    fill="rgba(7,24,45,.6)" stroke="url(#ns-metal)" stroke-width="3"/>
                  <path d="M100 20 156 42v50c0 39-22 71-56 95-34-24-56-56-56-95V42Z"
                    fill="none" stroke="#6abfff" stroke-opacity=".32" stroke-width="1"/>
                  <circle cx="100" cy="99" r="48" fill="none" stroke="#7bcaff" stroke-opacity=".38" stroke-width="1.4"/>
                  <circle cx="100" cy="99" r="37" fill="none" stroke="#a7ddff" stroke-opacity=".32" stroke-dasharray="2 5"/>
                  <path d="M100 39 111 85 158 99 111 111 100 158 89 111 42 99 89 85Z"
                    fill="url(#ns-metal)" stroke="#d8f3ff" stroke-width="1"/>
                  <path d="M100 54 105 94 145 99 105 104 100 144 95 104 55 99 95 94Z"
                    fill="#09203b" stroke="#c5edff" stroke-width="1.2"/>
                  <path d="M100 70 106 93 129 99 106 105 100 128 94 105 71 99 94 93Z" fill="url(#ns-core)"/>
                  <circle cx="100" cy="99" r="5" fill="#f2fbff"/>
                  <path d="M100 0v15M100 183v22M25 99h13M162 99h13" stroke="#8ed6ff" stroke-width="1.5" stroke-linecap="round" opacity=".65"/>
                </svg>
                <div class="ns-wordmark">NORTHSTAR</div>
                <div class="ns-subtitle">Cybersecurity Learning</div>
                <div class="ns-rule"></div>
                <div class="ns-credit">Developed and created by <strong>Swapnil Dalvi</strong></div>
                <button class="ns-enter" type="button">Enter NorthStar&nbsp; →</button>
              </div>
            `;
            document.body.appendChild(intro);

            const leave = () => {
              if (!intro.isConnected || intro.classList.contains('is-leaving')) return;
              intro.classList.add('is-leaving');
              window.setTimeout(() => intro.remove(), 800);
            };
            intro.querySelector('.ns-enter').addEventListener('click', leave);
            window.setTimeout(leave, 6500);
          })();
          INTRO

          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          html = p.read_text(encoding="utf-8")
          marker = "</body>"
          if marker not in html:
              raise SystemExit("Expected closing body tag in bundled index.html")
          html = html.replace(marker, '<script src="./apk-intro.js"></script>\\n' + chr(10) + marker, 1)
          p.write_text(html, encoding="utf-8")
          PY
          test -s www/apk-intro.js
          grep -q 'Developed and created by' www/apk-intro.js
          grep -q 'apk-intro.js' www/index.html

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      - name: Sync bundled app into Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: northstar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

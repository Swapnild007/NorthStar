name: Deploy NorthStar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JavaScript
        run: |
          node --check app.js
          python - <<'PY'
          import pathlib
          s=pathlib.Path("data/curriculum.js").read_text()
          stack=[]; pairs={")":"(","]":"[","}":"{"}; in_str=None; esc=False
          for i,ch in enumerate(s):
              if in_str:
                  if esc: esc=False
                  elif ch=="\\": esc=True
                  elif ch==in_str: in_str=None
              elif ch in "'\"`": in_str=ch
              elif ch in "([{": stack.append((ch,i))
              elif ch in ")]}":
                  if not stack or stack[-1][0]!=pairs[ch]: raise SystemExit(f"delimiter mismatch at index {i}: {ch}; stack top={stack[-1] if stack else None}")
                  stack.pop()
          print("delimiter stack:",stack[-10:])
          for ch,i in stack[-10:]: print("OPEN",ch,"INDEX",i,"CONTEXT",repr(s[max(0,i-80):i+120]))
          PY
          node --check data/curriculum.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
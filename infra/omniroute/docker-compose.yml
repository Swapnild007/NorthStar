services:
  omniroute:
    image: ghcr.io/diegosouzapw/omniroute:latest
    container_name: northstar-omniroute
    restart: unless-stopped
    ports:
      - "20128:20128"
    volumes:
      - omniroute-data:/app/data
    environment:
      NODE_ENV: production
      PORT: 20128
      HOSTNAME: 0.0.0.0
      DATA_DIR: /app/data
      REQUIRE_API_KEY: "true"
      AUTH_COOKIE_SECURE: "true"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:?set INITIAL_PASSWORD}
      API_KEY_SECRET: ${API_KEY_SECRET:?set API_KEY_SECRET}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?set STORAGE_ENCRYPTION_KEY}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20128/v1/models').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

volumes:
  omniroute-data:
